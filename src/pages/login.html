<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopNow</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-5">

    <!-- Login Section -->
    <section class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl">

        <!-- Logo and Heading -->
        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold text-purple-600">
                Shop<span class="text-gray-900">Now.</span>
            </h1>

            <h2 class="text-2xl font-bold text-gray-800 mt-6">
                Welcome Back!
            </h2>

            <p class="text-gray-500 mt-2">
                Login to your account and start shopping.
            </p>

        </div>

        <!-- Login Form -->
        <form action="#" method="POST">

            <!-- Gmail -->
            <div class="mb-5">

                <label class="block text-gray-700 font-semibold mb-2">
                    Gmail Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your Gmail address"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-purple-500"
                >

            </div>

            <!-- Password -->
            <div class="mb-4">

                <label class="block text-gray-700 font-semibold mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-purple-500"
                >

            </div>

            <!-- Remember and Forgot Password -->
            <div class="flex items-center justify-between mb-6">

                <label class="flex items-center gap-2 text-sm text-gray-600">
                    <input
                        type="checkbox"
                        name="remember"
                        class="accent-purple-600"
                    >
                    Remember Me
                </label>

                <a href="forgot-password.html"
                   class="text-sm text-purple-600 hover:underline">
                    Forgot Password?
                </a>

            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition duration-300">
                Login
            </button>

        </form>

        <!-- Register Link -->
        <p class="text-center text-gray-600 mt-6 text-sm">

            Don't have an account?

            <a href="home.html"
               class="text-purple-600 font-bold hover:underline">
                Register Now
            </a>

        </p>

        <!-- Back to Home -->
        <div class="text-center mt-6">

            <a href="home.html"
               class="inline-block border border-purple-600 text-purple-600 px-6 py-2 rounded-lg hover:bg-purple-600 hover:text-white transition">
                ← Back to Home
            </a>

        </div>

    </section>

</body>
</html>
