<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ShopNow</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-5">

    <!-- Registration Section -->
    <section class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl">

        <!-- Heading -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-purple-600">
                Shop<span class="text-gray-900">Now.</span>
            </h1>

            <h2 class="text-2xl font-bold text-gray-800 mt-5">
                Create Account
            </h2>

            <p class="text-gray-500 mt-2">
                Sign up to start your shopping journey!
            </p>
        </div>

        <!-- Registration Form -->
        <form action="#" method="POST">

            <!-- Name -->
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-purple-500"
                >
            </div>

            <!-- Phone -->
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">
                    Phone Number
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-purple-500"
                >
            </div>

            <!-- Gmail -->
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">
                    Gmail
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your Gmail address"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-purple-500"
                >
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    minlength="8"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-purple-500"
                >
            </div>

            <!-- Confirm Password -->
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    minlength="8"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-purple-500"
                >
            </div>

            <!-- Terms -->
            <div class="flex items-center gap-2 mb-6">
                <input type="checkbox" required class="accent-purple-600">
                <p class="text-sm text-gray-600">
                    I agree to the
                    <a href="#" class="text-purple-600 font-semibold">
                        Terms & Conditions
                    </a>
                </p>
            </div>

            <!-- Register Button -->
            <button
            id="create-btn"
                type="submit"
                class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition duration-300">
                Create Account
            </button>

        </form>

        <!-- Login Link -->
        <p class="text-center text-gray-600 mt-6 text-sm">
            Already have an account?
            <a href="home.html" class="text-purple-600 font-bold hover:underline">
                Login
            </a>
        </p>

    </section>

    <script  type="module" src="../Js/register.js"></script>

</body>
</html>
